<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía de consulta · PhysiQ-Assessment</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- PNG además del SVG: Chrome en Android (pestañas, historial) y la pantalla de inicio no siempre usan el SVG -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0a0d12">
<script>
// Tema y tamaño de letra antes de pintar, como index.html (misma preferencia guardada)
(function () {
  var t = 'dark';
  try {
    var p = localStorage.getItem('physiq-assessment-theme');
    t = p === 'light' || p === 'dark' ? p
      : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'light' ? '#ffffff' : '#0a0d12');
  try { if (localStorage.getItem('physiq-assessment-letra') === 'grande') document.documentElement.setAttribute('data-letra', 'grande'); } catch (e) {}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* Solo de la guía: el resto (tema, «¿Por qué?», citas, «✨ IA») es styles.css */
  .guia { max-width: 780px; margin: 0 auto; padding: 1rem 1rem 3rem; position: relative; }
  /* La región es el título: un botón sin caja que abre su propio menú, con los estilos de la
     guía (decisión del usuario, 2026-10: el selector del teléfono no seguía el tema). Cada región
     es un enlace a su #región/hoja, así que elegir es navegar, sin estado aparte */
  .guia-region { margin: 2px 0 4px; position: relative; }
  .guia-region-btn { display: inline-flex; align-items: center; gap: 0.35em; min-height: 44px; padding: 4px 0; border: none; background: none; color: var(--text); cursor: pointer; border-radius: 8px; font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 1.9rem; line-height: 1.2; text-align: left; }
  .guia-region-btn::after { content: '▾'; color: var(--accent); font-size: 1.2rem; font-family: 'Outfit', sans-serif; transition: transform 0.15s; }
  .guia-region-btn[aria-expanded="true"]::after { transform: rotate(180deg); }
  .guia-region-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .guia-region-menu { position: absolute; top: 100%; left: 0; z-index: 30; margin: 4px 0 0; padding: 6px; list-style: none; min-width: 240px; max-width: calc(100vw - 2rem); background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; box-shadow: var(--modal-shadow); font-family: 'Outfit', sans-serif; }
  .guia-region-menu[hidden] { display: none; }
  .guia-pie-regiones { position: relative; display: inline-block; }
  .guia-pie-reg-btn { font: inherit; font-weight: 600; color: var(--accent); background: none; border: none; padding: 4px 0; margin: -4px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .guia-pie-menu { top: auto; bottom: 100%; margin: 0 0 4px; }
  .guia-region-menu a { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 1rem; }
  .guia-region-menu a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .guia-region-menu a[aria-current="true"] { color: var(--accent); font-weight: 600; background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .guia-region-menu a[aria-current="true"]::after { content: '✓'; }
  @media (hover: hover) { .guia-region-menu a:hover { background: var(--surface2); } }
  .guia-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .guia-marca { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  /* Tema y letra, como en la cabecera de la app (misma preferencia guardada: lib/apariencia.js) */
  /* Una sola línea, centrada con los dos iconos; en pantalla estrecha, sin el nombre de la app */
  .guia-marca-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  @media (max-width: 560px) { .guia-marca-app { display: none; } }
  .guia-apariencia { display: flex; gap: 2px; margin-right: -6px; }
  .guia-apariencia .session-btn { min-width: 40px; min-height: 40px; text-transform: none; letter-spacing: 0; }
  .guia-apariencia a.session-btn { display: inline-flex; align-items: center; justify-content: center; color: inherit; text-decoration: none; }
  .guia-apariencia a.session-btn[aria-current="page"] { color: var(--accent); }
  @media print { .guia-apariencia { display: none; } }
  .guia-intro { font-size: 0.82rem; color: var(--text2); margin-bottom: 12px; line-height: 1.5; }
  .guia-nav { position: sticky; top: 0; z-index: 20; background: var(--bg); margin: 0 -1rem 14px; padding: 8px 1rem; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); }
  .guia-hojas { display: flex; gap: 6px; flex: 1 1 auto; }
  /* Base = el ancho de su texto y el sobrante a partes iguales: las pestañas largas
     («Irritabilidad», «Confirmación») no quedan pegadas al borde */
  .guia-hojas a { flex: 1 1 auto; text-align: center; text-decoration: none; font-size: 0.85rem; color: var(--text2); border: 1px solid var(--border2); border-radius: 8px; padding: 9px 6px; min-height: 40px; }
  .guia-hojas a[aria-current="page"] { color: var(--accent); border-color: var(--accent); font-weight: 500; }
  .guia h2 { font-size: 1.05rem; font-weight: 500; color: var(--text); margin: 18px 0 8px; }
  .guia-nota { font-size: 0.78rem; line-height: 1.45; color: var(--text3); margin: 2px 0 14px; }
  .guia-bloque { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 14px; margin-bottom: 14px; }
  .guia-bloque.especial { border-color: color-mix(in srgb, #7c4ddb 55%, var(--border)); }
  /* Número en línea, no colgado: al saltar de línea el texto vuelve al borde, alineado con
     las respuestas y «Por qué y más» (decisión del usuario, 2026-10) */
  .guia-bloque > h3 { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .guia-cond { font-size: 0.75rem; color: var(--text3); margin-bottom: 6px; }
  /* Sistemas del cribado e hipótesis de la confirmación, plegables (usuario, 2026-11):
     la línea dice qué hay dentro y, abierta, se queda fija bajo las pestañas
     (--guia-nav-alto, medido por guia.js) hasta que acaba el bloque */
  .guia-plegable > summary { display: block; list-style: none; cursor: pointer; position: relative; margin: -14px -14px 0; padding: 14px 40px 14px 14px; border-radius: 10px; background: var(--surface); -webkit-tap-highlight-color: transparent; }
  .guia-plegable > summary::-webkit-details-marker { display: none; }
  .guia-plegable > summary::after { content: '▾'; position: absolute; right: 14px; top: 15px; color: var(--text3); transition: transform 0.2s; }
  .guia-plegable[open] > summary::after { transform: rotate(180deg); }
  .guia-plegable[open] > summary { position: sticky; top: var(--guia-nav-alto, 57px); z-index: 5; border-bottom: 1px solid var(--border); border-radius: 10px 10px 0 0; margin-bottom: 6px; padding-bottom: 10px; }
  .guia-plegable > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* Fija arriba (guia.js, .fija): barra compacta de una línea, con sombra en vez de
     borde, para que al final del bloque tape poco y no parezca una doble raya
     (usuario, 2026-11). En la confirmación sigue la puntuación (y la derivación). El
     alto que pierde lo devuelve guia.js como margen, así que nada salta debajo */
  .guia-plegable.fija > summary { padding-top: 8px; padding-bottom: 8px; border-bottom-color: transparent; box-shadow: 0 6px 10px -6px var(--scrim); border-radius: 0; }
  .guia-plegable.fija > summary::after { top: 9px; }
  /* Tapa por arriba (usuario, 2026-11): entre las pestañas y la línea fija podía quedar
     una rendija de 1–3 px (redondeos al hacer scroll en móvil) por la que se veía el
     texto que pasa por detrás. Queda bajo las pestañas, que van por encima */
  .guia-plegable.fija > summary::before { content: ''; position: absolute; left: 0; right: 0; bottom: 100%; height: 40px; background: var(--surface); pointer-events: none; }
  .guia-plegable.fija > summary h3 { font-size: 0.95rem; margin-bottom: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .guia-plegable.fija > summary .guia-cond, .guia-plegable.fija > summary .guia-meta-linea, .guia-plegable.fija > summary .guia-progreso { display: none; }
  .guia-plegable.fija > summary .guia-bloque-meta { margin-top: 2px; }
  .guia-bloque-cab h3 { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .guia-bloque-cab .guia-cond { margin-bottom: 2px; }
  .guia-bloque-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 0.75rem; color: var(--text3); }
  .guia-bloque-meta:empty { display: none; }
  .guia-meta-linea { display: block; line-height: 1.45; }
  .guia-meta-urg { color: var(--red); font-weight: 600; }
  .guia-meta-der { color: var(--orange); font-weight: 600; }
  .guia-bloque-meta .guia-puntua { margin: 0; font-size: 0.8rem; }
  .guia-progreso { font-family: 'DM Mono', monospace; font-size: 0.72rem; }
  .guia-replegar { margin-top: 8px; }
  .guia-plegar-todo { display: flex; justify-content: flex-end; margin: 0 0 10px; }
  .guia-plegar-btn { font: inherit; font-size: 0.78rem; color: var(--accent); background: none; border: 1px solid var(--border2); border-radius: 8px; padding: 6px 10px; min-height: 36px; cursor: pointer; }
  @media print {
    .guia-plegable[open] > summary { position: static; }
    .guia-plegable > summary::after, .guia-plegar-todo { display: none; }
  }
  .guia-item { padding: 8px 0; border-top: 1px solid var(--border); scroll-margin-top: 72px; }
  .guia-item:first-of-type { border-top: none; }
  .guia-bloque.guia-item { padding: 10px 12px; }   /* paso del árbol: bloque e ítem a la vez, con el margen del bloque */
  .guia-item:target, .guia-item.destacado { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 6px; }
  .guia-num { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--accent); margin-right: 6px; }
  .guia-texto { font-size: 0.9rem; color: var(--text); line-height: 1.45; }
  /* line-height 1: con la del párrafo, las mayúsculas quedaban altas dentro del chip */
  .guia-chip { display: inline-block; font-size: 0.62rem; font-weight: 600; line-height: 1; border-radius: 8px; padding: 2px 6px; margin-left: 4px; vertical-align: 1px; }
  .guia-chip.urg { background: var(--red); color: #fff; }
  .guia-chip.der { background: var(--orange); color: #fff; }
  .guia-chip.cuando { background: var(--surface2); color: var(--text2); font-weight: 400; font-style: italic; }
  .guia-crit { font-size: 0.78rem; color: var(--text2); border-top: 1px dashed var(--border2); margin-top: 6px; padding-top: 6px; }
  /* Respuestas del paso agrupadas bajo la pregunta con una raya a la izquierda (decisión del
     usuario, 2026-10): se leen como ramas de la pregunta, no como más texto suyo */
  .guia-item > h3 { margin-bottom: 10px; }
  .guia-ops { list-style: none; margin: 0; display: grid; gap: 8px; border-left: 2px solid var(--border2); padding-left: 12px; }
  /* En Confirmación, el nombre del test destaca sobre su LR, su peso y su criterio */
  .guia-item[id^="test-"] > .guia-texto { font-weight: 600; }
  .guia-ops li { font-size: 0.85rem; color: var(--text2); line-height: 1.4; }
  .guia-ops b { color: var(--text); font-weight: 500; }
  .guia-hip { color: #8b5cf6; font-weight: 500; }
  .guia-der { color: var(--red); }
  .guia-salto { white-space: nowrap; }
  .guia-lr { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--text3); margin: 2px 0; }
  .guia-lr .util { color: var(--green); font-weight: 500; }
  .guia-peso { font-size: 0.8rem; color: var(--text2); margin: 2px 0; }
  .guia-criterio { font-size: 0.82rem; color: var(--text2); margin: 4px 0; line-height: 1.45; }
  /* Dentro de «Por qué y más» basta la línea del propio desplegable: sin la de cada apartado (usuario, 2026-11); los separa el espacio y su rótulo */
  .guia .razon-cuerpo .razon-seccion { margin: 14px 0 6px; border-left: 0; padding-left: 0; }
  .guia .razon-cuerpo ul, .guia .razon-cuerpo ol { padding-left: 18px; margin: 2px 0 4px; }
  .guia-pie { margin-top: 24px; font-size: 0.75rem; color: var(--text3); line-height: 1.5; border-top: 1px solid var(--border); padding-top: 10px; }
  .guia-urg { border: 1px solid var(--red); background: color-mix(in srgb, var(--red) 8%, var(--surface)); color: var(--text); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 0.82rem; line-height: 1.45; }
  .guia-urg b { color: var(--red); display: block; margin-bottom: 2px; }
  .guia-sinhip { border: 1px dashed var(--orange); background: var(--surface2); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 0.82rem; line-height: 1.5; color: var(--text2); }
  .guia-sinhip b { color: var(--orange); display: block; margin-bottom: 4px; }
  .guia-sinhip ul { margin: 0; padding-left: 1.1rem; }
  .guia-pie a { color: var(--accent); }
  .guia-calc { margin: 6px 0 2px; }
  .guia-puntua { font-size: 0.82rem; margin: 0 0 6px; color: var(--text2); }
  .guia-sin { color: var(--text3); font-size: 0.78rem; }
  .guia-resumen { border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
  .guia-resumen-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--text); }
  .guia-resumen-fila { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; padding: 6px 0; border-top: 1px solid var(--border); text-decoration: none; color: var(--text); font-size: 0.85rem; }
  .guia-resumen .guia-nota { margin: 6px 0 0; }
  .guia-borrar { font: inherit; font-size: 0.78rem; color: var(--red); background: none; border: 1px solid var(--border2); border-radius: 8px; padding: 6px 10px; min-height: 36px; cursor: pointer; }
  .guia-irr-res { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--border2); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; background: var(--surface); font-size: 0.85rem; line-height: 1.5; color: var(--text2); }
  .guia-irr-res strong { color: var(--text); }
  .guia-irr-baja { border-color: color-mix(in srgb, var(--green) 50%, var(--border)); background: color-mix(in srgb, var(--green) 7%, var(--surface)); }
  .guia-irr-moderada { border-color: color-mix(in srgb, var(--orange) 50%, var(--border)); background: color-mix(in srgb, var(--orange) 7%, var(--surface)); }
  .guia-irr-alta { border-color: color-mix(in srgb, var(--red) 50%, var(--border)); background: color-mix(in srgb, var(--red) 7%, var(--surface)); }
  .guia-irr-banda { position: fixed; left: 0; right: 0; z-index: 19; display: flex; align-items: center; gap: 6px; width: 100%; min-height: 44px; padding: 8px 1rem; border: 0; border-bottom: 1px solid var(--border); background: var(--bg); box-shadow: 0 8px 12px -4px var(--bg); color: var(--text2); font: inherit; font-size: 0.82rem; text-align: left; cursor: pointer; }
  .guia-irr-banda[hidden] { display: none; }
  .guia-irr-banda strong { color: var(--text); font-weight: 600; }
  .guia-irr-banda-det { flex: 1; min-width: 0; color: var(--text3); line-height: 1.3; }
  .guia-irr-banda strong { white-space: nowrap; }
  .guia-irr-banda-dir { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text3); white-space: nowrap; }
  @media print { .guia-irr-banda { display: none !important; } }
  .guia-irr-margen { font-size: 0.78rem; color: var(--text3); }
  .guia-irr-ops { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
  .guia-irr-ops .option-btn { width: 100%; min-height: 44px; font-size: 0.82rem; padding: 6px 8px; text-align: left; }
  .guia-irr-n { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text3); margin-right: 2px; }
  .guia-irr-pie { display: flex; justify-content: flex-end; padding: 10px 0 24px; }
  /* Banderas de cada sistema del cribado (plegadas al final de su bloque) */
  .guia-banderas { margin-top: 8px; border-top: 1px dashed var(--border2); padding-top: 6px; font-size: 0.82rem; }
  .guia-banderas > summary { cursor: pointer; color: var(--text2); min-height: 32px; line-height: 32px; }
  .guia-banderas ul { margin: 2px 0 6px; padding-left: 18px; color: var(--text2); line-height: 1.45; }
  .guia-banderas li { margin-bottom: 4px; }
  .guia-banderas-tit { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-top: 4px; }
  .guia-banderas-tit.roja { color: var(--red); } .guia-banderas-tit.amarilla { color: var(--orange); }
  .guia-bandera-q a { color: var(--accent); }
  /* Calculadoras de la guía (guia-calc.js): fase 1 y las condiciones especiales del cribado */
  .guia-gc-item { padding: 8px 0; border-top: 1px solid var(--border); }
  .guia-gc-item:first-of-type { border-top: none; }
  .guia-calc-cond { margin-top: 10px; border: 1px solid var(--border2); border-radius: 10px; background: var(--surface2); }
  .guia-calc-cond > summary { cursor: pointer; padding: 10px 12px; font-size: 0.85rem; font-weight: 600; min-height: 44px; }
  .guia-calc-cuerpo { padding: 0 12px 10px; }
  .guia-calc-cuerpo h4 { font-size: 0.8rem; margin: 12px 0 4px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
  .guia-gc-sino, .guia-gc-psico { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .guia-gc-sino .option-btn, .guia-gc-psico .option-btn { flex: 1 1 auto; min-height: 44px; font-size: 0.82rem; padding: 6px 10px; }
  .guia-gc-fila { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
  .guia-gc-num { display: flex; flex-direction: column; gap: 3px; font-size: 0.78rem; color: var(--text2); flex: 1 1 120px; }
  .guia-gc-num input, .guia-gc-tabla input[type="number"] { min-height: 44px; font: inherit; font-size: 0.9rem; padding: 6px 8px; border: 1px solid var(--border2); border-radius: 8px; background: var(--surface); color: var(--text); width: 100%; }
  .guia-gc-prep { margin: 4px 0 8px; padding-left: 18px; font-size: 0.78rem; color: var(--text2); }
  .guia-gc-tabla table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  .guia-gc-tabla th { text-align: left; font-weight: 600; color: var(--text2); padding: 2px 4px; }
  .guia-gc-tabla td { padding: 2px; }
  .guia-gc-tabla input[type="checkbox"] { width: 24px; height: 24px; }
  .guia-gc-res { margin-top: 10px; }
  .guia-gc-total { font-size: 0.85rem; font-weight: 600; margin: 0 0 6px; }
  .guia-calc-res { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--border2); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface); font-size: 0.82rem; line-height: 1.5; color: var(--text); }
  .guia-calc-res.alto { border-color: var(--red); background: color-mix(in srgb, var(--red) 8%, var(--surface)); }
  .guia-calc-res.medio { border-color: var(--orange); background: color-mix(in srgb, var(--orange) 9%, var(--surface)); }
  .guia-calc-res.bajo { border-color: color-mix(in srgb, var(--green) 50%, var(--border)); }
  .guia-calc-res.info { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  @media print { .guia-calc-cond, .guia-gc-psico, .guia-gc-sino, .guia-gc-res { display: none; } }
  @media (max-width: 480px) { .guia-irr-ops { grid-template-columns: 1fr; } .guia-hojas a { font-size: 0.8rem; padding: 9px clamp(3px, 0.9vw, 8px); } }
  /* Tiempos de tejido (#tejidos/<hoja>): título fijo en lugar del selector de región; el eje, bajo las pestañas */
  .guia-titulo { display: none; font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 1.9rem; line-height: 1.2; margin: 2px 0 4px; padding: 4px 0; }
  .guia-modo-tejidos .guia-titulo { display: block; }
  .guia-modo-tejidos .guia-region, .guia-modo-tejidos .guia-intro { display: none; }
  .guia-tejidos .tej-eje { top: var(--guia-nav-alto, 57px); background: var(--bg); }
  @media (max-width: 480px) { .guia-tejidos { margin: 0 -1rem; padding: 0 1rem; } }
