name: Deploy to PhysiQ hub

on:
  push:
    branches: [main]

concurrency:
  group: physiq-hub-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout physiq-assessment
        uses: actions/checkout@v4

      - name: Checkout physiq hub
        uses: actions/checkout@v4
        with:
          repository: physiodevapp/physiq
          token: ${{ secrets.PHYSIQ_DEPLOY_TOKEN }}
          path: physiq-hub

      - name: Copy files to hub
        run: |
          rm -rf physiq-hub/assessment
          mkdir -p physiq-hub/assessment/lib physiq-hub/assessment/icons physiq-hub/assessment/formularios physiq-hub/assessment/data
          cp index.html styles.css app.js state.js phase4.js phase4b.js formulario.js informe-ia.js grabadora.js data.js sw.js manifest.json favicon.svg .nojekyll physiq-hub/assessment/
          cp formularios/*.js physiq-hub/assessment/formularios/
          cp data/*.js physiq-hub/assessment/data/
          cp icons/icon-192.png icons/icon-512.png physiq-hub/assessment/icons/
          cp lib/session.js lib/informe-narrativo.js lib/audio-store.js lib/licencia-ia.js lib/valoracion-json.js lib/posquirurgico.js lib/version.js lib/region.js lib/revision-informe.js physiq-hub/assessment/lib/

      - name: Stamp deployed version
        # lib/version.js lleva 'dev' en el repo: aquí se sustituye por el commit
        # y la fecha, y version.json publica lo mismo para que la app detecte
        # que hay una versión más nueva que la que tiene cargada.
        run: |
          SHA="${GITHUB_SHA::7}"
          FECHA="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -i "s/^export const VERSION_SHA = 'dev';$/export const VERSION_SHA = '$SHA';/; s/^export const VERSION_FECHA = '';$/export const VERSION_FECHA = '$FECHA';/" physiq-hub/assessment/lib/version.js
          grep -q "^export const VERSION_SHA = '$SHA';$" physiq-hub/assessment/lib/version.js
          grep -q "^export const VERSION_FECHA = '$FECHA';$" physiq-hub/assessment/lib/version.js
          printf '{ "sha": "%s", "fecha": "%s" }\n' "$SHA" "$FECHA" > physiq-hub/assessment/version.json

      - name: Commit and push
        working-directory: physiq-hub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assessment/
          git diff --cached --quiet || git commit -m "chore: update assessment from physiq-assessment@${{ github.sha }}"
          for i in 1 2 4 8; do
            git push && break
            echo "Push rejected, retrying in ${i}s..."
            sleep $i
            git pull --rebase origin main
          done
